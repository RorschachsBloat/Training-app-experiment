<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118"><meta name="description" content="Create a local athlete profile, save training programmes and track lifting progress with PEAK Training.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>PEAK / Training</title>
<link rel="stylesheet" href="styles.css">
<script src="cloud-config.js" defer></script><script src="cloud-auth.js" defer></script>
<script src="core.js" defer></script><script src="xlsx-import.js" defer></script><script src="app.js" defer></script>
</head><body>
<div class="shell">
<header class="topbar"><button type="button" class="brand" data-action="home" aria-label="Home"><span class="mark">P<span>▲</span></span><span class="brandwords">PEAK <small>/ TRAINING</small></span></button><div class="topactions"><span id="offlineBadge" class="network"></span><button class="avatar" id="profileShortcut" data-action="profile" aria-label="Profile">+</button></div></header>
<main id="main" class="main" aria-live="polite"><div class="loading">Preparing your programme…</div></main>
<nav class="bottomnav" aria-label="Main navigation"><button data-nav="home"><span class="navicon">⌂</span><span>Home</span></button><button data-nav="library"><span class="navicon">▦</span><span>Library</span></button><button data-nav="progress"><span class="navicon">▥</span><span>Progress</span></button><button data-nav="settings"><span class="navicon">⚙</span><span>Settings</span></button><button data-nav="profile"><span class="navicon">◉</span><span>Profile</span></button></nav>
</div>
<input id="importFile" class="sr-only" type="file" accept=".xlsx,.json,.peakprogram,.peakupdate,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<input id="restoreFile" class="sr-only" type="file" accept=".json,application/json">
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Import programme"><div class="modalbox" id="modalBody"></div></div>
</body></html>
